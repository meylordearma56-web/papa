<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>Profesional Firestop LLC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a1f24;
        --ember: #c23b22;
        --surface: #f3f5f7;
        --surface-mid: #e6ebf0;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        min-height: 100dvh;
        width: 100%;
      }

      body {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        color: var(--ink);
        background:
          radial-gradient(120% 80% at 100% 0%, #dde4ea 0%, transparent 55%),
          linear-gradient(165deg, var(--surface) 0%, var(--surface-mid) 100%);
        font-family: "Barlow Condensed", sans-serif;
      }

      .top-bar {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: max(1rem, env(safe-area-inset-top))
          max(1.25rem, env(safe-area-inset-right)) 1rem
          max(1.25rem, env(safe-area-inset-left));
        z-index: 10;
      }

      .company-name {
        margin: 0;
        font-size: clamp(1.05rem, 2.8vw, 1.45rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink);
        line-height: 1.15;
        text-align: right;
        animation: fade-slide-in 0.7s ease-out both;
      }

      .company-name::after {
        content: "";
        display: block;
        width: 2.5rem;
        height: 3px;
        margin: 0.4rem 0 0 auto;
        background: var(--ember);
        animation: rule-grow 0.55s ease-out 0.25s both;
      }

      @keyframes fade-slide-in {
        from {
          opacity: 0;
          transform: translateX(0.75rem);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes rule-grow {
        from {
          width: 0;
          opacity: 0;
        }
        to {
          width: 2.5rem;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <header class="top-bar">
      <p class="company-name">Profesional Firestop LLC</p>
    </header>
    <script src="./app.js"></script>
  </body>
</html>
